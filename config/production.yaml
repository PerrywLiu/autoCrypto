# TripleEma 4h 2x 杠杆 实盘配置
# 使用: python scripts/run_production.py --config config/production.yaml

symbol: "BTC/USDT"          # 交易对
timeframe: "4h"              # K线周期
market_type: "swap"          # 永续合约

strategy:
  name: "triple_ema"
  ema_fast: 10
  ema_mid: 20
  ema_slow: 50
  ema_trend: 200
  adx_period: 14
  adx_threshold: 20
  ema_slope_lookback: 3       # EMA20 需保持同向斜率，过滤弱趋势
  min_ema_spread: 0.003       # EMA10/EMA50 至少拉开 0.3%，过滤粘合震荡
  min_atr_percentile: 0       # ATR 分位过滤关闭（优化结果不需要）
  atr_percentile_window: 180  # ATR 分位窗口，启用时使用
  atr_period: 14
  sl_atr_mult: 1.5           # 止损 = 入场价 ± 1.5×ATR
  tp_atr_mult: 3.0           # 止盈 = 入场价 ± 3×ATR
  cooldown_base: 6            # 基础冷却期 (4h K线数)
  cooldown_extra_per_loss: 3  # 每次亏损额外冷却

risk:
  initial_capital: 500        # 初始保证金 USDT
  leverage: 2                 # 杠杆倍数
  risk_per_trade: 0.02        # 单笔风险 2%
  max_notional_pct: 0.95      # 最大名义仓位 = 可用余额 × 杠杆 × 95%
  max_daily_loss_pct: 0.05    # 日熔断 5%
  max_consecutive_losses: 5   # 连续亏损暂停
  loss_pause_bars: 18         # 连续亏损后暂停 18 根4h K线(约72小时)再恢复

portfolio:
  enabled: true               # 启用组合级核心仓/卫星仓风控
  mode: "paper"               # paper=只记录计划; live 模式需先补成交确认后再开放
  core_weights:
    strong_bull: 0.60         # 强牛: BTC 核心仓 60%
    bull: 0.45                # 牛市: BTC 核心仓 45%
    neutral: 0.25             # 中性: BTC 核心仓 25%
    bear: 0.05                # 熊市: BTC 核心仓 5%
  swing_limits:
    strong_bull: {long: 0.30, short: 0.00}
    bull: {long: 0.30, short: 0.00}
    neutral: {long: 0.20, short: 0.10}
    bear: {long: 0.10, short: 0.30}
  rebalance_threshold: 0.05   # 普通调仓阈值
  bear_rebalance_threshold: 0.01
  urgent_drop_pct: 0.04       # 单根4h跌幅超过4%可触发急速减仓
  core_buy_step: 0.50         # 每次最多加核心仓 50%权益
  core_sell_step: 0.50        # 普通减仓每次最多减 50%权益
  urgent_sell_step: 1.00      # 急速减仓可一次完成目标差额
  spot_fee: 0.001
  max_net_exposure: 0.90      # 组合净 BTC 敞口上限
  max_gross_exposure: 1.20    # 组合总名义敞口上限
  max_short_exposure: 0.30    # 组合净空头敞口上限

mode:
  dry_run: true               # 纸上交易模式 (只看不下单)
  testnet: true               # 使用 OKX 模拟盘
  log_level: "INFO"           # DEBUG / INFO / WARNING
  heartbeat_minutes: 15       # 巡检间隔 (分钟)

output:
  trade_log: "outputs/production_trades.json"
  log_file: "outputs/production.log"
  state_file: "outputs/production_state.json"
